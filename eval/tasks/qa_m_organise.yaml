  # organise a folder would approve. Do NOT approve delete_file.
  create_folder: "yes"
  create_file: "yes"
  write_file: "yes"
  move_file: "yes"
  move_files: "yes"
  run_code: "yes"
  run_file: "yes"
setup: eval.qa_fixtures.setup_qa_organise
teardown: eval.qa_fixtures.teardown_qa_organise
grader: eval.qa_fixtures.grade_qa_m_organise
